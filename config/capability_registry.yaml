capabilities:
  - id: github.repo.list
    description: Search/list repositories visible to the authenticated GitHub user.
    agent_hint: "Use when you need to find a specific repository by name or topic before referencing it in another GitHub action, or when the user mentions 'a repo' without giving you an exact owner/name."
    risk_tier: read_only
    idempotency: read
    group: github
    subgroup: repositories
    input_schema_ref: github_repo_list_capability_input
    output_schema_ref: ""
    tags:
      - github
      - repository
    planner_hints:
      chat_collectible_fields: [query]
      chat_field_descriptions:
        query: Search text describing the repositories to list or search for.
      chat_field_questions:
        query: What exact search query should I use?
      chat_field_aliases:
        query: [query, github_query]
      chat_response_hint:
        mode: list
        items_field: items
        label_fields: [full_name, name]
        max_items: 10
        prefix: "Repositories:"
    enabled: true
    adapters:
      - type: mcp
        server_id: github_local
        tool_name: search_repositories
        route_paths:
          - /mcp
          - /mcp/rpc
          - /mcp/rpc/mcp
        timeout_s: 30
        max_retries: 1
        retry_sleep_s: 0.25
        arg_map: {}
        enabled: true
  - id: github.user.me
    description: Return the authenticated GitHub user profile.
    agent_hint: "Use to confirm which GitHub identity you're acting as before an action where attribution matters (e.g. before creating a PR), not as a general way to look up other users."
    risk_tier: read_only
    idempotency: read
    group: github
    subgroup: users
    input_schema_ref: ""
    output_schema_ref: ""
    tags:
      - github
      - user
      - identity
    enabled: true
    adapters:
      - type: mcp
        server_id: github_local
        tool_name: get_me
        route_paths:
          - /mcp
          - /mcp/rpc
          - /mcp/rpc/mcp
        timeout_s: 20
        max_retries: 1
        retry_sleep_s: 0.25
        arg_map: {}
        enabled: true
  - id: github.issue.search
    description: Search issues and pull requests visible to the authenticated GitHub user.
    agent_hint: "Use before opening a new issue or PR to check whether one matching the topic already exists, to avoid creating a duplicate."
    risk_tier: read_only
    idempotency: read
    group: github
    subgroup: issues
    input_schema_ref: github_search_issues_capability_input
    output_schema_ref: ""
    tags:
      - github
      - issues
      - pull-requests
      - search
    planner_hints:
      chat_collectible_fields: [query]
      chat_field_descriptions:
        query: Search text describing the issues or pull requests to find.
      chat_field_questions:
        query: What exact search query should I use?
      chat_field_aliases:
        query: [query, github_query, contextual_information, grounding_facts, retrieved_content]
    enabled: true
    adapters:
      - type: mcp
        server_id: github_local
        tool_name: search_issues
        route_paths:
          - /mcp
          - /mcp/rpc
          - /mcp/rpc/mcp
        timeout_s: 30
        max_retries: 1
        retry_sleep_s: 0.25
        arg_map: {}
        enabled: true
  - id: github.user.search
    description: Search GitHub users by query.
    agent_hint: "Use to resolve a person's GitHub handle from a name or partial query, e.g. before assigning a reviewer or mentioning someone."
    risk_tier: read_only
    idempotency: read
    group: github
    subgroup: users
    input_schema_ref: github_search_users_capability_input
    output_schema_ref: ""
    tags:
      - github
      - users
      - search
    enabled: true
    adapters:
      - type: mcp
        server_id: github_local
        tool_name: search_users
        route_paths:
          - /mcp
          - /mcp/rpc
          - /mcp/rpc/mcp
        timeout_s: 30
        max_retries: 1
        retry_sleep_s: 0.25
        arg_map: {}
        enabled: true
  - id: github.branch.create
    description: Create a branch in a GitHub repository.
    agent_hint: "Use before pushing or editing files on GitHub when you need an isolated branch first -- call this ahead of file-edit or pull-request capabilities, not after."
    risk_tier: bounded_write
    idempotency: safe_write
    group: github
    subgroup: branches
    input_schema_ref: github_create_branch_capability_input
    output_schema_ref: ""
    tags:
      - github
      - branch
      - create
    enabled: true
    adapters:
      - type: mcp
        server_id: github_local
        tool_name: create_branch
        route_paths:
          - /mcp
          - /mcp/rpc
          - /mcp/rpc/mcp
        timeout_s: 30
        max_retries: 1
        retry_sleep_s: 0.25
        arg_map: {}
        enabled: true
  - id: github.branch.list
    description: List repository branches.
    agent_hint: "Use to check whether a branch already exists before creating one, or to confirm the exact branch name before pushing files to it."
    risk_tier: read_only
    idempotency: read
    group: github
    subgroup: branches
    input_schema_ref: github_list_branches_capability_input
    output_schema_ref: ""
    tags:
      - github
      - branch
      - list
    planner_hints:
      chat_response_hint:
        mode: list
        items_field: items
        label_fields: [name]
        max_items: 15
        prefix: "Branches:"
    enabled: true
    adapters:
      - type: mcp
        server_id: github_local
        tool_name: list_branches
        route_paths:
          - /mcp
          - /mcp/rpc
          - /mcp/rpc/mcp
        timeout_s: 30
        max_retries: 1
        retry_sleep_s: 0.25
        arg_map: {}
        enabled: true
  - id: github.files.push
    description: Push multiple files to a repository branch in one commit.
    agent_hint: "Use when you have more than one file ready to commit together -- prefer this over repeated github.file.create_or_update calls to keep related changes in a single commit."
    risk_tier: high_risk
    idempotency: unsafe_write
    group: github
    subgroup: files
    input_schema_ref: github_push_files_capability_input
    output_schema_ref: ""
    tags:
      - github
      - files
      - push
      - commit
    enabled: true
    adapters:
      - type: mcp
        server_id: github_local
        tool_name: push_files
        route_paths:
          - /mcp
          - /mcp/rpc
          - /mcp/rpc/mcp
        timeout_s: 45
        max_retries: 1
        retry_sleep_s: 0.25
        arg_map: {}
        enabled: true
  - id: github.file.create_or_update
    description: Create or update a single file in a repository.
    agent_hint: "Use for one isolated file change. If you're changing several files at once, prefer github.files.push instead so they land in one commit."
    risk_tier: bounded_write
    idempotency: safe_write
    group: github
    subgroup: files
    input_schema_ref: github_create_or_update_file_capability_input
    output_schema_ref: ""
    tags:
      - github
      - file
      - create
      - update
    enabled: true
    adapters:
      - type: mcp
        server_id: github_local
        tool_name: create_or_update_file
        route_paths:
          - /mcp
          - /mcp/rpc
          - /mcp/rpc/mcp
        timeout_s: 30
        max_retries: 1
        retry_sleep_s: 0.25
        arg_map: {}
        enabled: true
  - id: github.file.delete
    description: Delete a file from a repository branch.
    agent_hint: "Use only when removing the file is the actual goal -- don't reach for this as a 'cleanup' step during a multi-file edit unless deletion itself was requested."
    risk_tier: bounded_write
    idempotency: safe_write
    group: github
    subgroup: files
    input_schema_ref: github_delete_file_capability_input
    output_schema_ref: ""
    tags:
      - github
      - file
      - delete
    enabled: true
    adapters:
      - type: mcp
        server_id: github_local
        tool_name: delete_file
        route_paths:
          - /mcp
          - /mcp/rpc
          - /mcp/rpc/mcp
        timeout_s: 30
        max_retries: 1
        retry_sleep_s: 0.25
        arg_map: {}
        enabled: true
  - id: github.pull_request.create
    description: Create a pull request in a repository.
    agent_hint: "Use once your branch's file changes are already pushed -- this is the last step in a code-change sequence, not something to call before the files exist on the branch."
    risk_tier: bounded_write
    idempotency: safe_write
    group: github
    subgroup: pull_requests
    input_schema_ref: github_create_pull_request_capability_input
    output_schema_ref: ""
    tags:
      - github
      - pull_request
      - create
    enabled: true
    adapters:
      - type: mcp
        server_id: github_local
        tool_name: create_pull_request
        route_paths:
          - /mcp
          - /mcp/rpc
          - /mcp/rpc/mcp
        timeout_s: 30
        max_retries: 1
        retry_sleep_s: 0.25
        arg_map: {}
        enabled: true
  - id: filesystem.artifacts.list
    description: List files under shared artifacts storage.
    agent_hint: "Use to discover what already exists in shared artifacts storage before deciding whether to create, overwrite, or read a file -- check here first when unsure if an earlier step already produced something."
    risk_tier: read_only
    idempotency: read
    group: filesystem
    subgroup: artifacts
    input_schema_ref: filesystem_list_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - artifacts
      - list
    planner_hints:
      chat_response_hint:
        mode: entries
        entries_field: entries
        label_fields: [path]
        max_items: 20
        prefix: "Entries:"
        empty_message: "No entries found."
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: list_files
        arg_map: {}
        enabled: true
  - id: filesystem.artifacts.read_text
    description: Read a UTF-8 text file from shared artifacts storage.
    agent_hint: "Use once you already know the exact path of a text artifact. If you don't know the path yet, call filesystem.artifacts.list or filesystem.artifacts.search_text first."
    risk_tier: read_only
    idempotency: read
    group: filesystem
    subgroup: artifacts
    input_schema_ref: filesystem_read_text_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - artifacts
      - read
      - text
    planner_hints:
      chat_response_hint:
        mode: text
        content_field: content
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: file_read_text
        arg_map: {}
        enabled: true
  - id: filesystem.artifacts.write_text
    description: Write text to shared artifacts storage at a specific path.
    agent_hint: "Use to persist a text result once you already know the exact destination path you want."
    risk_tier: bounded_write
    idempotency: safe_write
    group: filesystem
    subgroup: artifacts
    input_schema_ref: filesystem_write_text_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - artifacts
      - write
      - text
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: file_write_text
        arg_map: {}
        enabled: true
  - id: filesystem.artifacts.write_content
    description: Write text content to shared artifacts storage with optional path.
    agent_hint: "Use like filesystem.artifacts.write_text when you don't have a specific path in mind and are fine letting the storage layer choose one; prefer write_text instead when the exact destination matters."
    risk_tier: bounded_write
    idempotency: safe_write
    group: filesystem
    subgroup: artifacts
    input_schema_ref: filesystem_write_artifact_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - artifacts
      - write
      - content
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: file_write_artifact
        arg_map: {}
        enabled: true
  - id: filesystem.workspace.list
    description: List files under workspace storage.
    agent_hint: "Use to see what's in the git-aware workspace/repo checkout before a code-editing or repository action. Use this instead of filesystem.artifacts.list when the file is meant to become part of a repo, not a standalone artifact."
    risk_tier: read_only
    idempotency: read
    group: filesystem
    subgroup: workspace
    input_schema_ref: filesystem_list_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - workspace
      - list
    planner_hints:
      chat_response_hint:
        mode: entries
        entries_field: entries
        label_fields: [path]
        max_items: 20
        prefix: "Entries:"
        empty_message: "No entries found."
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: workspace_list_files
        arg_map: {}
        enabled: true
  - id: filesystem.workspace.read_text
    description: Read a UTF-8 text file from workspace storage.
    agent_hint: "Use to read a file that lives in the workspace/repo checkout, not shared artifacts. If you're unsure which storage a file is in, call filesystem.workspace.list first."
    risk_tier: read_only
    idempotency: read
    group: filesystem
    subgroup: workspace
    input_schema_ref: filesystem_read_text_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - workspace
      - read
      - text
    planner_hints:
      chat_response_hint:
        mode: text
        content_field: content
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: workspace_read_text
        arg_map: {}
        enabled: true
  - id: filesystem.artifacts.move_to_workspace
    description: Move a file from shared artifacts to workspace.
    agent_hint: "Use when something you produced in shared artifacts storage now needs to become part of the workspace/repo -- the bridge between the two storage areas."
    risk_tier: bounded_write
    idempotency: safe_write
    group: filesystem
    subgroup: transfer
    input_schema_ref: filesystem_artifact_move_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - artifacts
      - workspace
      - move
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: artifact_move
        arg_map: {}
        enabled: true
  - id: filesystem.artifacts.search_text
    description: Search text within shared artifacts files.
    agent_hint: "Use when you need to find which artifact file contains something, not just what files exist -- reach for this over filesystem.artifacts.list when you're searching by content rather than by filename."
    risk_tier: read_only
    idempotency: read
    group: filesystem
    subgroup: artifacts
    input_schema_ref: filesystem_search_text_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - artifacts
      - search
      - text
    planner_hints:
      chat_response_hint:
        mode: search_matches
        matches_field: matches
        max_items: 10
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: search_text
        arg_map: {}
        enabled: true
  - id: filesystem.artifacts.mkdir
    description: Create a directory under shared artifacts storage.
    agent_hint: "Use before writing several files into a new artifacts subfolder together. A single file write usually doesn't need this since the parent directory is created for you."
    risk_tier: bounded_write
    idempotency: safe_write
    group: filesystem
    subgroup: artifacts
    input_schema_ref: filesystem_mkdir_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - artifacts
      - mkdir
      - directory
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: artifact_mkdir
        arg_map: {}
        enabled: true
  - id: filesystem.workspace.mkdir
    description: Create a directory under workspace storage.
    agent_hint: "Use before writing several files into a new workspace subfolder together -- same caveat as filesystem.artifacts.mkdir, usually unnecessary for a single file write."
    risk_tier: bounded_write
    idempotency: safe_write
    group: filesystem
    subgroup: workspace
    input_schema_ref: filesystem_mkdir_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - workspace
      - mkdir
      - directory
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: workspace_mkdir
        arg_map: {}
        enabled: true
  - id: filesystem.artifacts.delete
    description: Delete a file or directory under shared artifacts storage.
    agent_hint: "Use only when removal itself is the goal -- this is destructive and can't be undone from here, so don't call it as a speculative 'cleanup' step."
    risk_tier: bounded_write
    idempotency: safe_write
    group: filesystem
    subgroup: artifacts
    input_schema_ref: filesystem_delete_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - artifacts
      - delete
      - directory
      - file
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: artifact_delete
        arg_map: {}
        enabled: true
  - id: filesystem.workspace.delete
    description: Delete a file or directory under workspace storage.
    agent_hint: "Use only when removal itself is the goal, same caveat as filesystem.artifacts.delete -- be certain before calling this on workspace/repo files."
    risk_tier: bounded_write
    idempotency: safe_write
    group: filesystem
    subgroup: workspace
    input_schema_ref: filesystem_delete_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - workspace
      - delete
      - directory
      - file
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: workspace_delete
        arg_map: {}
        enabled: true
  - id: filesystem.artifacts.rename
    description: Rename or move a file/directory within shared artifacts storage.
    agent_hint: "Use to correct or relocate a file's path without re-reading and re-writing its content -- cheaper than a read-then-write-then-delete sequence when you're just moving something."
    risk_tier: bounded_write
    idempotency: safe_write
    group: filesystem
    subgroup: artifacts
    input_schema_ref: filesystem_rename_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - artifacts
      - rename
      - move
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: artifact_rename
        arg_map: {}
        enabled: true
  - id: filesystem.workspace.rename
    description: Rename or move a file/directory within workspace storage.
    agent_hint: "Use to move/rename a file already in the workspace -- same idea as filesystem.artifacts.rename but scoped to the repo checkout."
    risk_tier: bounded_write
    idempotency: safe_write
    group: filesystem
    subgroup: workspace
    input_schema_ref: filesystem_rename_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - workspace
      - rename
      - move
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: workspace_rename
        arg_map: {}
        enabled: true
  - id: filesystem.artifacts.copy
    description: Copy a file/directory within shared artifacts storage.
    agent_hint: "Use when you need a second, independent copy of an artifact -- e.g. before an operation that might overwrite it -- without disturbing the original."
    risk_tier: bounded_write
    idempotency: safe_write
    group: filesystem
    subgroup: artifacts
    input_schema_ref: filesystem_copy_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - artifacts
      - copy
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: artifact_copy
        arg_map: {}
        enabled: true
  - id: filesystem.workspace.copy
    description: Copy a file/directory within workspace storage.
    agent_hint: "Use for the same reason as filesystem.artifacts.copy, scoped to workspace files."
    risk_tier: bounded_write
    idempotency: safe_write
    group: filesystem
    subgroup: workspace
    input_schema_ref: filesystem_copy_capability_input
    output_schema_ref: ""
    tags:
      - filesystem
      - workspace
      - copy
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: workspace_copy
        arg_map: {}
        enabled: true
  - id: memory.read
    description: Read memory entries for pointer resolution and context hydration.
    agent_hint: "Use at the start of a task, or before repeating work, to check whether something relevant was already stored by an earlier step or a previous run -- cheaper than redoing the work."
    risk_tier: read_only
    idempotency: read
    group: memory
    subgroup: retrieval
    input_schema_ref: memory_read_capability_input
    output_schema_ref: ""
    tags:
      - memory
      - read
      - pointer
      - context
    planner_hints:
      chat_response_hint:
        mode: json_preview
        entries_fields: [entries, matches]
        max_items: 5
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: memory_read
        arg_map: {}
        enabled: true
  - id: memory.write
    description: Write memory entries for reuse across tasks, jobs, and scopes.
    agent_hint: "Use to save an intermediate result or decision that you or a later step will need again -- write it here rather than relying on it staying in context, since context can get summarized away."
    risk_tier: bounded_write
    idempotency: safe_write
    group: memory
    subgroup: mutation
    input_schema_ref: memory_write_capability_input
    output_schema_ref: ""
    tags:
      - memory
      - write
      - pointer
      - context
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: memory_write
        arg_map: {}
        enabled: true
  - id: memory.semantic.write
    description: Persist distilled semantic facts (user/domain/environment knowledge) for later lookup and reasoning.
    agent_hint: "Use specifically for durable facts about the user, domain, or environment that should still be true and useful in a future, unrelated run -- not for task-scoped intermediate results, which belong in memory.write instead."
    risk_tier: bounded_write
    idempotency: safe_write
    group: memory
    subgroup: semantic
    input_schema_ref: memory_semantic_write_capability_input
    output_schema_ref: ""
    tags:
      - memory
      - semantic
      - knowledge
      - write
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: memory_semantic_write
        arg_map: {}
        enabled: true
  - id: memory.semantic.search
    description: Retrieve ranked semantic facts by natural-language query for grounding and reasoning.
    agent_hint: "Use to check whether a durable fact about the user, domain, or environment is already known before asking the user again or re-deriving it -- the semantic counterpart to memory.read for facts rather than task-scoped results."
    risk_tier: read_only
    idempotency: read
    group: memory
    subgroup: semantic
    input_schema_ref: memory_semantic_search_capability_input
    output_schema_ref: ""
    tags:
      - memory
      - semantic
      - knowledge
      - search
    planner_hints:
      chat_response_hint:
        mode: json_preview
        entries_fields: [entries, matches]
        max_items: 5
    enabled: true
    adapters:
      - type: tool
        server_id: local_worker
        tool_name: memory_semantic_search
        arg_map: {}
        enabled: true
  - id: rag.retrieve
    description: Retrieve ranked chunks from a vector-backed RAG index for grounding and citations.
    agent_hint: "Use when you need grounding from a document corpus that's already indexed -- reach for this before rag.index.* capabilities, which are for adding new content, not retrieving existing content."
    risk_tier: read_only
    idempotency: read
    group: rag
    subgroup: retrieval
    input_schema_ref: rag_retrieve_capability_input
    output_schema_ref: rag_retrieve_capability_output
    tags:
      - rag
      - retrieval
      - vector-db
      - qdrant
      - grounding
    planner_hints:
      chat_response_hint:
        mode: rag_matches
        max_items: 5
        excerpt_chars: 180
      rag_grounded_synthesis: true
    enabled: true
    adapters:
      - type: mcp
        server_id: rag_retriever_qdrant
        tool_name: retrieve
        route_paths:
          - /mcp/rpc/mcp
          - /mcp/mcp
          - /mcp/rpc
          - /mcp
        timeout_s: 20
        max_retries: 1
        retry_sleep_s: 0.25
        arg_map: {}
        enabled: true
  - id: rag.retrieve.rerank
    description: Rerank retrieved RAG matches with deterministic lexical and metadata-aware scoring.
    agent_hint: "Use after rag.retrieve when the top results look noisy or off-topic and you need tighter ranking before citing them -- not a substitute for the initial retrieval call."
    risk_tier: read_only
    idempotency: read
    group: rag
    subgroup: retrieval
    input_schema_ref: rag_rerank_capability_input
    output_schema_ref: rag_rerank_capability_output
    tags:
      - rag
      - retrieval
      - rerank
      - grounding
      - citations
    enabled: true
    adapters:
      - type: mcp
        server_id: rag_retriever_qdrant
        tool_name: rerank
        route_paths:
          - /mcp/rpc/mcp
          - /mcp/mcp
          - /mcp/rpc
          - /mcp
        timeout_s: 20
        max_retries: 1
