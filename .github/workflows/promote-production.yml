name: promote-production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag to promote to production, for example sha-abc123def456"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  verify-ci-provenance:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Verify image_tag corresponds to a successful ci run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ ! "${IMAGE_TAG}" =~ ^sha-[0-9a-f]{12}$ ]]; then
            echo "::error::image_tag '${IMAGE_TAG}' does not match the expected format sha-<12 hex chars> (the format produced by release-staging.yml's publish-images job). Refusing to promote."
            exit 1
          fi

          SHORT_SHA="${IMAGE_TAG#sha-}"
          echo "Resolving commit for ${SHORT_SHA}..."
          if ! FULL_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHORT_SHA}" --jq '.sha' 2>/tmp/resolve_err.txt)"; then
            cat /tmp/resolve_err.txt >&2
            echo "::error::No commit in ${GITHUB_REPOSITORY} matches '${SHORT_SHA}' (from image_tag '${IMAGE_TAG}'). Refusing to promote an image that doesn't correspond to a real commit."
            exit 1
          fi
          echo "Resolved to full SHA ${FULL_SHA}."

          echo "Checking ci workflow runs for ${FULL_SHA}..."
          CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${FULL_SHA}&status=completed&per_page=1" --jq '.workflow_runs[0].conclusion // empty')"

          if [ -z "${CONCLUSION}" ]; then
            echo "::error::No completed 'ci' workflow run found for commit ${FULL_SHA} (image_tag ${IMAGE_TAG}). Refusing to promote an image whose commit never had ci run to completion."
            exit 1
          fi

          if [ "${CONCLUSION}" != "success" ]; then
            echo "::error::Latest 'ci' workflow run for commit ${FULL_SHA} (image_tag ${IMAGE_TAG}) concluded '${CONCLUSION}', not 'success'. Refusing to promote."
            exit 1
          fi

          echo "ci workflow succeeded for commit ${FULL_SHA} (image_tag ${IMAGE_TAG}) — proceeding with promotion."

  deploy-production:
    needs: verify-ci-provenance
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          PRODUCTION_KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG_B64 }}
        run: |
          if [ -z "${PRODUCTION_KUBECONFIG_B64:-}" ]; then
            echo "::error::Missing PRODUCTION_KUBECONFIG_B64 secret."
            exit 1
          fi
          printf '%s' "${PRODUCTION_KUBECONFIG_B64}" | base64 --decode > "${RUNNER_TEMP}/kubeconfig"
          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig" >> "${GITHUB_ENV}"

      - name: Write production env file
        env:
          PRODUCTION_ENV_FILE_CONTENT: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          if [ -z "${PRODUCTION_ENV_FILE_CONTENT:-}" ]; then
            echo "::error::Missing PRODUCTION_ENV_FILE secret."
            exit 1
          fi
          printf '%s' "${PRODUCTION_ENV_FILE_CONTENT}" > .env.production

      - name: Resolve image owner
        id: image
        run: |
          IMAGE_OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image_owner=${IMAGE_OWNER}" >> "${GITHUB_OUTPUT}"

      - name: Deploy production release
        run: |
          PRODUCTION_IMAGE_REGISTRY=ghcr.io \
          PRODUCTION_IMAGE_OWNER=${{ steps.image.outputs.image_owner }} \
          PRODUCTION_IMAGE_TAG=${{ github.event.inputs.image_tag }} \
          make k8s-up-production

      - name: Capture production cluster snapshot
        if: always()
        run: |
          mkdir -p artifacts/release
          kubectl get deploy,po,svc -n awe -o wide > artifacts/release/production-cluster-snapshot.txt

      - name: Upload production cluster snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-cluster-snapshot-${{ github.event.inputs.image_tag }}
          path: artifacts/release/production-cluster-snapshot.txt
