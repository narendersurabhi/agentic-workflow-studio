name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentic
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Lint
        run: make lint
      - name: Format
        run: make format-check
      - name: Type check
        run: make typecheck
      - name: Tests
        run: make test
      - name: Intent Eval Gate
        run: make eval-intent-gate
      - name: Chat Boundary Eval Gate
        run: make eval-chat-boundary-gate
      - name: Chat Clarification Eval Gate
        run: make eval-chat-clarification-gate
      - name: DeepEval Agent Gate
        run: make eval-deepeval-gate
        continue-on-error: true
      - name: Upload DeepEval Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deepeval-agent-reports
          if-no-files-found: ignore
          path: |
            artifacts/evals/deepeval_chat_report.json
            artifacts/evals/deepeval_planner_report.json
            artifacts/evals/deepeval_gate_report.json
      - name: Docker build
        run: docker compose build

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/ui/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
