[mypy]
python_version = 3.13
explicit_package_bases = True
namespace_packages = True
mypy_path = .
files = libs/core
follow_imports = skip

# Start with a stable, useful baseline focused on shared orchestration code.
# We intentionally exclude service entrypoints/alembic/tests/tools from strict
# checking and grow coverage incrementally.
exclude = (?x)(^services/|^tests/|^libs/tools/|^libs/core/tests/|^services/api/app/alembic/)

ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = False
no_implicit_optional = True

disallow_untyped_defs = False
disallow_any_generics = False
check_untyped_defs = True

[mypy-libs.core.tool_registry]
disable_error_code = misc,no-redef

# Pre-existing arg-type/union-attr debt surfaced when the lint/typecheck gate was
# reconnected to CI (was silently not running). Tracked for cleanup; see
# https://github.com/narendersurabhi/agentic-workflow-studio/issues/110
[mypy-libs.core.chat_routing_feedback]
disable_error_code = arg-type

[mypy-libs.core.feedback_eval]
disable_error_code = arg-type

[mypy-libs.core.chat_routing_reranker]
disable_error_code = arg-type

[mypy-libs.core.chat_routing_calibrator]
disable_error_code = arg-type

[mypy-libs.core.intent_contract]
disable_error_code = arg-type,union-attr

[mypy-libs.core.intent_eval]
disable_error_code = union-attr

[mypy-libs.core.planner_contracts]
disable_error_code = arg-type,union-attr

[mypy-libs.core.execution_contracts]
disable_error_code = arg-type

[mypy-libs.core.run_specs]
disable_error_code = assignment

[mypy-yaml]
ignore_missing_imports = True
