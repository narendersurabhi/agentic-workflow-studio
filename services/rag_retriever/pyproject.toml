[project]
name = "agentic-rag-retriever"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141",
  "uvicorn>=0.27",
  "pydantic>=2.13",
  "mcp>=1.0.0",
  "boto3>=1.34",
  "prometheus-client>=0.19",
  "structlog>=24.1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.setuptools]
packages = ["app", "rag_retriever_core"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
