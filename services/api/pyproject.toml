[project]
name = "agentic-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.141",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0.52",
  "psycopg2-binary>=2.9",
  "redis>=5.0",
  "pydantic>=2.13",
  "prometheus-client>=0.19",
  "structlog>=24.1.0",
  "opentelemetry-api>=1.22.0",
  "opentelemetry-sdk>=1.22.0",
]

[tool.ruff]
line-length = 100
extend-exclude = ["app/alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
